# MealLog 饮食记录应用 —— meallog.xxx.cc
# ⚠️ 使用前请全局替换：xxx.cc 改为你的实际域名；证书文件名改为 cert/ 目录下的实际文件名
# ⚠️ Cloudflare Origin 证书专用提醒：
#   本配置面向 Cloudflare 回源场景，必须保持 Cloudflare DNS 记录为【橙色云朵】（代理开启）。
#   若切为灰色（直连源站），浏览器会报证书不信任（Origin 证书不被公共 CA 信任）。

server {
    listen 443 ssl;
    server_name meallog.xxx.cc;

    # 泛域名证书（SSL 终止只在总代理完成，业务容器不接触证书）
    # Cloudflare Origin 证书有效期最长 15 年，需在 Cloudflare 控制台 SSL/TLS → Origin Server 生成
    ssl_certificate     /etc/nginx/cert/xxx.cc.crt;
    ssl_certificate_key /etc/nginx/cert/xxx.cc.key;

    # 现代 TLS 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 转发到 MealLog 前端容器：使用 compose 服务名 frontend（网络内置 DNS 解析），
    # 不依赖容器名，业务侧容器名变了也不受影响
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;

        # 传递真实客户端信息与原始协议，保证后端识别正确
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / HMR 支持
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

# ─────────────────────────────────────────────────────────────
# 新增业务 app2 模板（照抄本文件，改 4 处即可）：
#   1. 文件名：conf/20-app2.conf
#   2. server_name app2.xxx.cc
#   3. proxy_pass http://frontend:80（新业务的服务名:内部端口，勿写容器名）
#   4. 无需改证书（泛域名证书 *.xxx.cc 自动覆盖所有二级域名）
# 然后 docker-compose restart，立即生效
# ─────────────────────────────────────────────────────────────
