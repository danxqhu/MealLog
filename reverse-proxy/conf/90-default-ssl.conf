# 443 默认 server：丢弃未匹配任何二级域名的请求
# （直接关闭连接，不泄露证书信息，也防止以 IP 访问时落到某个业务上）
# 注意：default_server 完成 TLS 握手也需要一份证书，引用泛域名证书即可
# （Cloudflare Origin 证书场景同样适用，保持橙色云朵开启）
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/cert/xxx.cc.crt;
    ssl_certificate_key /etc/nginx/cert/xxx.cc.key;

    return 444;
}
