# =============================================================================
# 基础配置 = 生产模式（nginx + node，无热更新，稳定低开销）
#
# 日常开发：直接 `docker-compose up -d`
#   → docker-compose 会自动加载同目录下的 docker-compose.override.yml，
#     切换到 nodemon / react-scripts 热更新模式，无需手动改配置。
#
# 纯生产部署：`docker-compose -f docker-compose.yml up -d --build`
#   → 显式只加载本文件，跳过 override，得到 nginx 静态托管 + node 直启。
# =============================================================================

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-meallog_password}
      MYSQL_DATABASE: meal_log
      MYSQL_USER: ${DB_USER:-mealuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-meallog_password}
    # 不映射 MySQL 到宿主机：backend 通过内部网络以服务名 mysql 访问数据库，
    # 多实例部署时避免 3306 端口冲突；如需宿主机调试可临时加 "13306:3306" 映射
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - meal-log-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务（生产模式：node 直接启动）
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    # 不写 container_name：容器名由 compose 自动生成，同一网络内总反向代理
    # 通过服务名 backend:3001 即可访问（compose 网络内置 DNS 解析服务名），
    # 避免固定容器名导致未来多实例部署冲突
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-mealuser}
      DB_PASSWORD: ${DB_PASSWORD:-meallog_password}
      DB_NAME: meal_log
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key}
    # 不映射宿主机端口：仅 frontend 容器经内网代理访问 backend:3001，
    # 对外访问统一由独立总反向代理（仓库 reverse-proxy/ 目录）接管 80/443
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - meal-log-network

  # 前端服务（生产模式：nginx 托管打包后的静态资源）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    # 不写 container_name：总反向代理通过服务名 frontend:80 内网访问
    # （compose 网络内置 DNS 按服务名解析），固定容器名会让多实例部署冲突
    restart: unless-stopped
    # 不映射宿主机端口：对外由总反向代理按二级域名转发进来（见 reverse-proxy/ 目录），
    # 临时调试可手动加回 "3000:80"
    depends_on:
      - backend
    networks:
      - meal-log-network

volumes:
  mysql_data:
    driver: local

networks:
  # 使用固定网络名（不带 compose 项目名前缀），与独立总反向代理共享：
  # 总代理 compose 中以 external: true 引用同名网络即可接入本应用
  meal-log-network:
    name: meal-log-network
    driver: bridge
